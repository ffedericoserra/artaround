name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Start the app
        run: docker compose up --build -d --wait api
      - name: Run contract tests
        run: dotnet test contract-tests/ArtAround.ContractTests
      - name: Show server logs on failure
        if: failure()
        run: docker compose logs api setup
