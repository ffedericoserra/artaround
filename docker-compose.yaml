# `docker compose up --build` runs the whole app at http://localhost:8000.
# The password and JWT secret below are for local use only: set your own in the
# environment (or a .env file) for anything public.

x-api-environment: &api-environment
  ConnectionStrings__Default: Host=db;Database=artaround;Username=artaround;Password=${POSTGRES_PASSWORD:-artaround}
  Jwt__Secret: ${JWT_SECRET:-local-only-secret-change-me-before-deploying}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: artaround
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artaround}
      POSTGRES_DB: artaround
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artaround"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Runs once: applies migrations, then seeds an empty database.
  setup:
    build: .
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "./efbundle --connection \"$$ConnectionStrings__Default\" && dotnet ArtAround.Api.dll seed"]

  api:
    build: .
    environment: *api-environment
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  postgres_data:
