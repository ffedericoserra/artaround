version: '3.8'

services:
  # 1. MongoDB Container
  mongo_db:
    image: mongo:latest
    container_name: local_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: REMOVED       # Matches your index.js
      MONGO_INITDB_ROOT_PASSWORD: REMOVED         # Matches your index.js
      MONGO_INITDB_DATABASE: REMOVED      # Matches your index.js
    ports:
      - "27017:27017" # Exposes DB to your local machine (for mongosh/Compass)
    volumes:
      - mongo_data:/data/db

  # 2. Node.js Container (Node 22)
  node_app:
    image: node:22
    container_name: local_node_app
    working_dir: /app/backend-node
    volumes:
      - ./:/app              # Maps your current folder to /app in container
      - /app/backend-node/node_modules    # Prevents local node_modules from overwriting container's
    ports:
      - "8000:8000"          # Maps port 8000 (from index.js) to localhost
    depends_on:
      - mongo_db
    environment:
      # Passiamo TUTTE le variabili necessarie al DB
      DB_HOST: mongo_db 
      DB_USER: REMOVED
      DB_PASS: REMOVED
      DB_NAME: REMOVED
      PORT: 8000
      JWT_SECRET: REMOVED
      JWT_EXPIRES_IN: 1d    
    command: sh -c "npm install && npm start"

  # 3. Postgres for the .NET backend (5432 and 5433 are taken by other containers)
  postgres_db:
    image: postgres:17
    container_name: artaround-dev-db
    restart: always
    environment:
      POSTGRES_USER: artaround
      POSTGRES_PASSWORD: artaround
      POSTGRES_DB: artaround
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  postgres_data: